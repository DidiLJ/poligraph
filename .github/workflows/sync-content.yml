name: Sync Content (Legislation)

on:
  schedule:
    # Run every Sunday at 5:00 AM UTC (after votes sync)
    - cron: "0 5 * * 0"
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  sync-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Sync Legislation (Dossiers Législatifs)
        run: npm run sync:legislation
        continue-on-error: true

      - name: Show legislation stats
        run: npm run sync:legislation:stats
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Sync Content Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
