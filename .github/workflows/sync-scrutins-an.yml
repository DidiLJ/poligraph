name: Sync Scrutins (Official AN)

on:
  schedule:
    # Run every Sunday at 4:00 AM UTC (after politicians sync)
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max scrutins to sync (default: all)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || 'https://poligraph.fr' }}

jobs:
  sync-scrutins-an:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Long job, can take up to 60 min
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Sync Scrutins from Official AN API
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            npm run sync:scrutins-an -- --limit=${{ github.event.inputs.limit }}
          else
            npm run sync:scrutins-an
          fi

      - name: Revalidate votes cache
        run: npm run cache:revalidate -- votes

      - name: Show sync stats
        if: always()
        run: npm run sync:stats
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Sync Scrutins (AN) Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [sync-scrutins-an]
    if: failure() && !cancelled()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const label = "sync-scrutins-an-failure";
            const title = `Sync Scrutins AN failed - ${new Date().toISOString().split("T")[0]}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## Sync Scrutins (AN) failed",
              "",
              `**Workflow run**: ${runUrl}`,
              `**Triggered by**: ${context.actor}`,
              `**Commit**: \`${context.sha.slice(0, 7)}\``,
              "",
              "### Checklist",
              "- [ ] Open the workflow run and identify the failing step",
              "- [ ] Check `docs/RUNBOOK.md` for triage steps",
              "- [ ] Re-run the workflow once the underlying cause is fixed",
              "- [ ] Close this issue when resolved",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, "automated"],
              });
            }
